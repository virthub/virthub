# Cargo.toml

[workspace]
resolver = "2"

members = [
    "src/config",
    "src/index",
    "src/master",
    "src/store",
    "src/klnk/klnk-core",
    "src/klnk/klnk-daemon",
    "src/klnk/klnk-ebpf",
    "src/klnk/klnk-net",
    "src/klnk/klnk-shim",
    "src/klnk/klnk-uffd",
    "src/klnk/librmashim",
    "src/connectors/lmcache",
    "src/connectors/sglang",
    "src/connectors/vllm",
    "bindings/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Virthub Contributors"]
license = "MIT"

[workspace.dependencies]
# Async Runtime & Utilities
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
once_cell = "1.19"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Concurrency & Data Structures
dashmap = "5.5"
parking_lot = "0.12"
ahash = "0.8"
twox-hash = "1.6"
crossbeam-queue = "0.3"
crc32fast = "1.3"

# Telemetry & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System, Affinity & Kernel Interfaces
libc = "0.2"
nix = { version = "0.27", features = ["mman", "event", "feature", "poll", "resource", "signal", "socket", "user"] }
userfaultfd = "0.8"
socket2 = "0.5"
core_affinity = "0.8"

# Error Handling
thiserror = "1.0"

# Futures (for async utilities)
futures = "0.3"

[workspace.lints]
# Rustc lints
rust.missing_docs = "warn"
rust.unused = "warn"
rust.unsafe_code = "forbid"

# Clippy lints (use dot instead of ::)
clippy.all = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
