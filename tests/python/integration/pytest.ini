# tests/python/integration/pytest.ini

[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

markers =
    integration: integration test (may be slow)
    slow: slow running test
    gpu: requires GPU
    performance: performance / benchmark test

filterwarnings =
    ignore::DeprecationWarning:torch\.jit\._script
    ignore::DeprecationWarning:transformers\.models\.gpt2\.tokenization_gpt2
    ignore:.*multi-threaded.*fork.*:DeprecationWarning
