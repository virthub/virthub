# virthub/src/connectors/lmcache/Cargo.toml

[package]
name = "virthub-connector-lmcache"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Virthub memory tiering and disaggregation connector for LMCache framework"

[dependencies]
# Internal Workspace Dependencies
klnk-core = { path = "../../klnk/klnk-core" }
librmashim = { path = "../../klnk/librmashim" }
virthub_config = { path = "../../config" }
store = { path = "../../store" }

# Data Serialization
serde = { workspace = true }

# Bincode for serializing/deserializing KV blocks (used in error enum)
bincode = "1.3"

# Async Runtime & Synchronization
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread"] }

# Error Handling
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
